<!DOCTYPE html>
<html lang="{{ .Section }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="stylesheet" href="{{ "font.css" | relURL }}">
    <link rel="stylesheet" href="{{ "styles.css" | relURL }}">
</head>
<body>
    <h1><span class="meta">{{ strings.TrimLeft "0" .File.BaseFileName }}.</span>{{ .Title }}</h1>
    {{ .Content }}
    <nav>
        <a href="{{ .CurrentSection.RelPermalink }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-list"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </a>
        {{ $nextNum := printf "%03d" (add (strings.TrimLeft "0" .File.BaseFileName | int) 1) }}
        {{ $next := index (where .CurrentSection.Pages "File.BaseFileName" $nextNum) 0 }}
        {{ with $next }}
        <a href="{{ .RelPermalink }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        {{ end }}
    </nav>
</body>
</html>
