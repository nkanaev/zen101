    <h1><span class="meta">7.</span>Thông Báo</h1>
    <p>Tanzan viết sáu mươi tấm bưu thiếp vào ngày cuối cùng của đời ông, và sai một người hầu cận gửi bưu thiếp đi. Xong rồi ông từ giã cõi đời.</p>
<p>Những tấm thiếp viết:</p>
<blockquote>
<p>Ta sắp rời khỏi cõi trần gian này. <br>
Đây là lời thông báo cuối cùng của ta.</p>
<p>Tanzan. <br>
Tháng 7 ngày 27, 1892</p>
</blockquote>
